<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Conheça a Rio Selvagem Rafting, uma empresa especializada em passeios de rafting. Entre em contato conosco para dúvidas, reservas ou sugestões.">
    <meta name="author" content="Janaína Silva Sousa">

    <title>Fale Conosco | Rio Selvagem Rafting</title>

    <link rel="stylesheet" href="estilos/rafting.css">

</head>

<body>

    <header>
        <img src="imagens/logorioselvagem.png" alt="Logo Rio Selvagem Rafting">

        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>

    <main>
        <section class="contato">

            <h1>Companhia de Rafting em Corredeiras</h1>

            <p>123 Rua Principal do Rio</p>
            <p>Aquidauana, Mato Grosso do Sul</p>
            <p>+55 66 99999-9999</p>
            <p>info@rioselvagem.com</p>

            <div class="contato-grid">
                <div class="mapa">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d29901.061052463698!2d-55.70584543902342!3d-20.48027657977154!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x947de5005a84654d%3A0x8210b2a8a1e73803!2sRancho%20Radical!5e0!3m2!1spt-BR!2sbr!4v1785611781620!5m2!1spt-BR!2sbr"
                      width="600" height="450" allowfullscreen="" loading="lazy"
                      referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>

                <section class="equipe">

                    <h2>Estamos Aqui para Servi-lo</h2>

                    <div class="funcionarios">

                        <figure>
                            <img src="imagens/joao.jpg" alt="Guia João">
                            <figcaption>
                                <strong>João Silva</strong><br>
                                Guia de Rafting
                            </figcaption>
                        </figure>

                        <figure>
                            <img src="imagens/maria.jpg" alt="Atendente Maria">
                            <figcaption>
                                <strong>Maria Souza</strong><br>
                                Atendimento
                            </figcaption>
                        </figure>

                        <figure>
                            <img src="imagens/carlos.jpg" alt="Instrutor Carlos">
                            <figcaption>
                                <strong>Carlos Lima</strong><br>
                                Instrutor
                            </figcaption>
                        </figure>

                    </div>

                </section>
                <div class="formulario">
                    <form>

                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome">

                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email">

                        <p>Propósito da Mensagem</p>

                        <label>
                            <input type="radio" name="assunto" value="duvida" checked>
                            Dúvida Geral
                        </label>

                        <label>
                            <input type="radio" name="assunto" value="reserva">
                            Pergunta sobre Reserva
                        </label>

                        <label>
                            <input type="radio" name="assunto" value="sugestao">
                            Sugestão
                        </label>

                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem"></textarea>

                        <label>
                            <input type="checkbox" name="newsletter">
                            Quero receber a newsletter mensal
                        </label>

                        <input type="submit" value="Entrar em Contato!">
                    </form>

                </div>
            </div>
            </div>

        </section>
    </main>

    <footer>

        <p>
            ©2026 Rio Selvagem Rafting | Janaína Silva Sousa
        </p>

        <nav class="redes-sociais">

            <a href="https://facebook.com">
                <img src="imagens/facebook.png" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="imagens/instagram.png" alt="Instagram">
            </a>

            <a href="https://x.com">
                <img src="imagens/x-bw.svg" alt="X">
            </a>

        </nav>

    </footer>

</body>
